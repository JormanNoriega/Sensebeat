<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SensaBeat - Juego de memoria accesible para ciegos">
  <title>SensaBeat - Memoria</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23FF0080'>◎</text></svg>">

  <link rel="stylesheet" href="src/styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="main-menu-container"></div>

  <script src="src/core/AudioManager.js"></script>
  <script src="src/core/InputManager.js"></script>
  <script src="src/core/VoiceManager.js"></script>
  <script src="src/ui/MainMenu.js"></script>

  <script>
    let mainMenu;
    let audioManager;
    const BACKGROUND_MUSIC_PATH = 'assets/audio/fondo/menu.mp3';

    function init() {
      audioManager = new AudioManager();
      audioManager.init(0.7, 0.5);

      mainMenu = new MainMenu({
        onStartGame: (level) => {
          window.location.href = `game.html?level=${level}`;
        }
      });

      mainMenu.show();

      audioManager.playBackgroundMusic(BACKGROUND_MUSIC_PATH, 0.3);

      const muteBtn = document.getElementById('mute-button');
      if (muteBtn) {
        muteBtn.addEventListener('click', () => {
          const isMuted = audioManager.toggleMute();
          muteBtn.innerHTML = isMuted ? '🔇' : '🔊';
          muteBtn.style.borderColor = isMuted ? '#FF0080' : '#00FFFF';
        });
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
